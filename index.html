<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HACK://PROTOCOLO</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#03070a;font-family:'Courier New',Courier,monospace;color:#7dffb0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  body::before{content:'';position:fixed;inset:0;z-index:999;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,0.18) 3px,rgba(0,0,0,0) 4px);mix-blend-mode:multiply;}
  body::after{content:'';position:fixed;inset:0;z-index:998;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(0,255,150,0.05),rgba(0,0,0,0.75) 75%);}
  #game{position:absolute;inset:0;display:block;z-index:0;}

  #hud{position:fixed;top:0;left:0;width:100%;z-index:10;padding:10px 60px 0 14px;transition:opacity .3s;}
  #hud.hidden{opacity:0;pointer-events:none;}
  .hud-top{display:flex;justify-content:space-between;gap:10px;}
  .hud-box{background:rgba(4,16,12,0.72);border:1px solid rgba(57,255,136,0.35);border-radius:4px;padding:5px 12px;display:flex;flex-direction:column;align-items:center;min-width:78px;box-shadow:0 0 14px rgba(57,255,136,0.12) inset;transition:border-color .3s;}
  .hud-box.ok{border-color:rgba(57,255,136,0.95);box-shadow:0 0 18px rgba(57,255,136,0.4) inset;}
  .hud-label{font-size:9px;letter-spacing:2px;color:#3f8a63;}
  .hud-val{font-size:16px;font-weight:bold;color:#8affc0;text-shadow:0 0 10px rgba(57,255,136,0.8);}
  .hud-val.ok{color:#39ff88;text-shadow:0 0 14px #39ff88;}
  #timebar{margin-top:8px;height:6px;width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(57,255,136,0.25);border-radius:3px;overflow:hidden;}
  #timebarFill{height:100%;width:100%;background:#39ff88;box-shadow:0 0 12px currentColor;transition:width .12s linear,background .3s;}

  #pauseBtn,#muteBtn{position:fixed;top:14px;z-index:12;width:40px;height:40px;background:rgba(4,16,12,0.85);border:1.5px solid rgba(57,255,136,0.5);border-radius:8px;color:#8affc0;font-family:inherit;font-size:16px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 14px rgba(57,255,136,0.15);padding:0;margin:0;line-height:1;clip-path:none;}
  #pauseBtn{right:14px;}
  #muteBtn{right:62px;}
  #pauseBtn:hover,#muteBtn:hover{background:rgba(57,255,136,0.15);}
  #pauseBtn.hidden,#muteBtn.hidden{display:none;}

  #resetBtn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:12;padding:10px 22px;background:rgba(4,16,12,0.9);border:1.5px solid rgba(255,217,59,0.6);border-radius:8px;color:#ffd93b;font-family:inherit;font-size:12px;font-weight:bold;letter-spacing:2px;cursor:pointer;box-shadow:0 0 14px rgba(255,217,59,0.2);}
  #resetBtn:hover{background:rgba(255,217,59,0.12);}
  #resetBtn.hidden{display:none;}

  .overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 50%,rgba(4,20,14,0.88),rgba(1,4,6,0.97));backdrop-filter:blur(2px);animation:fadeIn .35s ease;}
  .overlay.hidden{display:none;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  h1.glitch{font-size:clamp(28px,7vw,64px);letter-spacing:5px;color:#8affc0;text-shadow:0 0 12px rgba(57,255,136,0.9),0 0 40px rgba(57,255,136,0.4);position:relative;}
  h1.glitch::before,h1.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;overflow:hidden;}
  h1.glitch::before{color:#ff2d55;animation:gl1 2.6s infinite linear alternate-reverse;}
  h1.glitch::after{color:#2df2ff;animation:gl2 3.4s infinite linear alternate-reverse;}
  @keyframes gl1{0%{clip-path:inset(10% 0 80% 0);transform:translate(-2px,-2px);}25%{clip-path:inset(60% 0 20% 0);transform:translate(3px,1px);}50%{clip-path:inset(30% 0 55% 0);transform:translate(-3px,2px);}75%{clip-path:inset(75% 0 5% 0);transform:translate(2px,-1px);}100%{clip-path:inset(45% 0 40% 0);transform:translate(-1px,2px);}}
  @keyframes gl2{0%{clip-path:inset(70% 0 15% 0);transform:translate(2px,1px);}30%{clip-path:inset(20% 0 65% 0);transform:translate(-3px,-2px);}60%{clip-path:inset(50% 0 30% 0);transform:translate(2px,2px);}100%{clip-path:inset(5% 0 85% 0);transform:translate(-2px,1px);}}
  .sub{margin-top:14px;font-size:clamp(10px,2.4vw,14px);letter-spacing:4px;color:#3f8a63;}

  button{margin-top:24px;font-family:inherit;font-size:clamp(14px,3.2vw,18px);font-weight:bold;letter-spacing:3px;padding:14px 32px;color:#03130b;background:#39ff88;border:none;cursor:pointer;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:0 0 26px rgba(57,255,136,0.55);transition:transform .18s,box-shadow .18s,background .18s;}
  button:hover{transform:translateY(-3px);box-shadow:0 0 48px rgba(57,255,136,0.95);background:#5cffa3;}
  button:active{transform:translateY(0) scale(.98);}
  button.secondary{background:transparent;color:#7dffb0;border:2px solid #39ff88;box-shadow:none;clip-path:none;border-radius:6px;}
  button.secondary:hover{background:rgba(57,255,136,0.12);}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:24px;}
  .btn-row button{margin-top:0;}

  #loading{gap:26px;}
  .terminal{width:min(560px,88vw);min-height:190px;background:rgba(2,10,7,0.85);border:1px solid rgba(57,255,136,0.35);border-radius:6px;padding:18px 20px;text-align:left;box-shadow:0 0 40px rgba(57,255,136,0.12);}
  .terminal-head{display:flex;gap:6px;margin-bottom:14px;}
  .dot{width:10px;height:10px;border-radius:50%;background:#1d4433;}
  .dot.r{background:#ff2d55;}.dot.y{background:#ffd93b;}.dot.g{background:#39ff88;}
  .logline{font-size:clamp(11px,2.4vw,14px);color:#6fe6a2;letter-spacing:1px;line-height:1.85;animation:typeIn .25s ease;}
  .logline::after{content:'_';animation:blink .8s steps(1) infinite;}
  .logline.done::after{content:'';}
  @keyframes typeIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:none;}}
  @keyframes blink{50%{opacity:0;}}
  .loadbar{width:min(560px,88vw);height:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(57,255,136,0.3);border-radius:4px;overflow:hidden;}
  #loadFill{height:100%;width:0%;background:#39ff88;box-shadow:0 0 16px #39ff88;transition:width .45s ease;}

  #msgOverlay{background:rgba(2,7,5,0.62);}
  #msgOverlay h2{font-size:clamp(28px,8vw,72px);letter-spacing:8px;animation:pop .35s cubic-bezier(.2,1.6,.4,1);}
  #msgOverlay p{margin-top:16px;font-size:clamp(11px,2.6vw,15px);letter-spacing:5px;color:#3f8a63;animation:pop .5s cubic-bezier(.2,1.6,.4,1);}
  @keyframes pop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  #msgOverlay[data-type="fail"] h2{color:#ff3b4e;text-shadow:0 0 22px #ff3b4e;}
  #msgOverlay[data-type="ok"] h2{color:#39ff88;text-shadow:0 0 22px #39ff88;}
  #msgOverlay[data-type="win"] h2{color:#2df2ff;text-shadow:0 0 22px #2df2ff;}

  #winScreen h2{font-size:clamp(22px,5.5vw,44px);letter-spacing:5px;color:#2df2ff;text-shadow:0 0 22px #2df2ff;}
  #winScreen .score-big{font-size:clamp(34px,9vw,64px);font-weight:bold;color:#ffd93b;text-shadow:0 0 22px #ffd93b;margin-top:14px;letter-spacing:4px;}
  #winScreen .score-label{font-size:11px;color:#3f8a63;letter-spacing:4px;margin-top:6px;}
  #winScreen p{margin-top:14px;color:#3f8a63;letter-spacing:2px;font-size:clamp(11px,2.5vw,13px);line-height:1.8;}
  #winScreen .agent-tag{margin-top:8px;color:#8affc0;font-size:13px;letter-spacing:3px;}
  #winScreen .save-badge{margin-top:16px;color:#39ff88;font-size:11px;letter-spacing:3px;}
  #winScreen .save-badge.warn{color:#ffd93b;}
  #winScreen .save-badge.err{color:#ff3b4e;}

  .nameInput{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .nameInput label{font-size:11px;color:#3f8a63;letter-spacing:4px;}
  .nameInput input{background:rgba(4,16,12,0.85);border:1.5px solid rgba(57,255,136,0.5);border-radius:6px;color:#8affc0;font-family:inherit;font-size:18px;font-weight:bold;letter-spacing:4px;padding:14px 18px;text-align:center;width:min(320px,84vw);outline:none;text-transform:uppercase;}
  .nameInput input:focus{border-color:#39ff88;box-shadow:0 0 20px rgba(57,255,136,0.4);}
  #nameScreen h2{font-size:clamp(24px,6vw,48px);letter-spacing:6px;color:#8affc0;text-shadow:0 0 22px #39ff88;}

  #rankScreen h2{font-size:clamp(22px,5.5vw,42px);letter-spacing:5px;color:#ffd93b;text-shadow:0 0 22px #ffd93b;}
  .rankList{margin-top:24px;width:min(520px,92vw);max-height:52vh;overflow-y:auto;border:1px solid rgba(57,255,136,0.3);border-radius:8px;background:rgba(2,10,7,0.75);}
  .rankRow{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(57,255,136,0.1);font-size:13px;letter-spacing:1px;}
  .rankRow:last-child{border-bottom:none;}
  .rankRow.me{background:rgba(57,255,136,0.14);}
  .rankRow.me .rankName{color:#ffd93b;}
  .rankPos{width:46px;font-weight:bold;color:#3f8a63;flex-shrink:0;}
  .rankRow.top1 .rankPos{color:#ffd93b;}
  .rankRow.top2 .rankPos{color:#c0c8d0;}
  .rankRow.top3 .rankPos{color:#cd7f32;}
  .rankName{flex:1;color:#8affc0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rankScore{color:#ffd93b;font-weight:bold;text-align:right;padding-left:10px;}
  .rankDate{color:#3f8a63;font-size:10px;padding-left:12px;min-width:70px;text-align:right;}
  .rankEmpty{padding:24px;color:#3f8a63;font-size:12px;}

  #cutFlash{position:fixed;inset:0;z-index:15;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,45,85,0.0),rgba(255,45,85,0.28) 100%);opacity:0;transition:opacity .1s;}
  #cutFlash.on{opacity:1;transition:opacity .28s;}

  #alarmOverlay{position:fixed;inset:0;z-index:14;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,45,85,0) 40%,rgba(255,45,85,0.55) 100%);opacity:0;transition:opacity .2s;}

  #pauseOverlay h2{font-size:clamp(30px,7vw,54px);letter-spacing:8px;color:#8affc0;text-shadow:0 0 22px #39ff88;}
  #pauseOverlay p{margin-top:14px;color:#3f8a63;letter-spacing:3px;font-size:12px;}
  .storage-warning{margin-top:16px;font-size:10px;color:#ffd93b;letter-spacing:2px;max-width:400px;line-height:1.6;}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="cutFlash"></div>
<div id="alarmOverlay"></div>

<button id="muteBtn" class="hidden" title="Som">🔊</button>
<button id="pauseBtn" class="hidden" title="Pausar">❚❚</button>
<button id="resetBtn" class="hidden">↺ RESETAR CABO</button>

<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-box"><span class="hud-label" id="lbl1">NÍVEL</span><span class="hud-val" id="hudLevel">1</span></div>
    <div class="hud-box"><span class="hud-label" id="lbl2">TEMPO</span><span class="hud-val" id="hudTime">100</span></div>
    <div class="hud-box" id="cableBox"><span class="hud-label" id="lbl3">CABO</span><span class="hud-val" id="hudCables">0/160</span></div>
  </div>
  <div id="timebar"><div id="timebarFill"></div></div>
</div>

<div class="overlay" id="menu">
  <h1 class="glitch" data-text="HACK://PROTOCOLO">HACK://PROTOCOLO</h1>
  <p class="sub">SISTEMA DE INFILTRAÇÃO v4.5</p>
  <div class="btn-row">
    <button id="btnStart">COMEÇAR O HACK</button>
    <button id="btnRank" class="secondary">RANKING</button>
  </div>
</div>

<div class="overlay hidden" id="nameScreen">
  <h2>IDENTIFICAÇÃO</h2>
  <p class="sub">DIGITE SEU NOME DE AGENTE</p>
  <div class="nameInput">
    <label>NOME / CODINOME</label>
    <input id="playerNameInput" maxlength="12" placeholder="AGENTE" autocomplete="off" spellcheck="false">
  </div>
  <div class="btn-row">
    <button id="btnConfirmName">INICIAR MISSÃO</button>
    <button id="btnBackToMenu" class="secondary">VOLTAR</button>

</div>

<div class="overlay hidden" id="loading">
  <div class="terminal">
    <div class="terminal-head"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
    <div id="loadLog"></div>
  </div>
  <div class="loadbar"><div id="loadFill"></div></div>
</div>

<div class="overlay hidden" id="msgOverlay" data-type="ok">
  <h2 id="msgText">SISTEMA INVADIDO</h2>
  <p id="msgSub"></p>
</div>

<div class="overlay hidden" id="pauseOverlay">
  <h2>PAUSADO</h2>
  <p>O SISTEMA AGUARDA</p>
  <div class="btn-row">
    <button id="btnResume">CONTINUAR</button>
    <button id="btnPauseMenu" class="secondary">MENU</button>
  </div>
</div>

<div class="overlay hidden" id="winScreen">
  <h2>ACESSO TOTAL CONCEDIDO</h2>
  <p>VOCÊ INVADIU O NÚCLEO DO SISTEMA</p>
  <div class="score-big" id="finalScore">0</div>
  <div class="score-label">PONTUAÇÃO FINAL</div>
  <div class="agent-tag" id="winAgentTag">AGENTE: —</div>
  <div class="save-badge" id="saveBadge"></div>
  <div class="btn-row">
    <button id="btnSeeRank">VER RANKING</button>
    <button id="btnRestart" class="secondary">JOGAR NOVAMENTE</button>
  </div>
</div>

<div class="overlay hidden" id="rankScreen">
  <h2>RANKING</h2>
  <div class="rankList" id="rankList"></div>
  <div class="btn-row">
    <button id="btnRankClose">VOLTAR</button>
    <button id="btnRankClear" class="secondary" style="font-size:11px;padding:8px 16px;">LIMPAR</button>
  </div>
</div>

<script>
/* =========================================================
   HACK://PROTOCOLO v4.5
   - FASE 1: cabo com comprimento mínimo, 12 obstáculos,
     botão protegido por 3 escudos orbitando (toque = reset)
   - FASE 2: PONG com velocidade progressiva
     (2 rebatidas = 1.5x, 4 rebatidas = 2x)
   - FASE 3: memória
   - Pause, Ranking, Áudio procedural
   ========================================================= */

const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

/* =========================================================
   ÁUDIO
   ========================================================= */
let audioCtx = null;
let masterGain = null;
let musicGain = null;
let muted = false;
let musicTimer = null;
let musicStep = 0;

function ensureAudio(){
  if(!audioCtx){
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : 0.32;
      masterGain.connect(audioCtx.destination);
      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0.55;
      musicGain.connect(masterGain);
    } catch(e){ audioCtx = null; }
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, dur, type, vol, delay){
  if(!audioCtx || muted) return;
  const t0 = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(masterGain);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol){
  if(!audioCtx || muted) return;
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.value = vol || 0.15;
  src.connect(g); g.connect(masterGain);
  src.start();
}
const Sfx = {
  click:    () => playTone(700, 0.05, 'square', 0.12),
  grab:     () => playTone(1100, 0.05, 'sine', 0.08),
  drop:     () => playTone(500, 0.06, 'sine', 0.09),
  connect:  () => { playTone(600, 0.09, 'square', 0.16); playTone(900, 0.12, 'square', 0.16, 0.06); },
  cut:      () => { noiseBurst(0.14, 0.18); playTone(180, 0.14, 'sawtooth', 0.2); },
  block:    () => playTone(280, 0.06, 'square', 0.10),
  buttonOn: () => { playTone(440, 0.1, 'square', 0.2); playTone(660, 0.12, 'square', 0.2, 0.08); playTone(880, 0.18, 'square', 0.2, 0.16); },
  resetCable: () => { playTone(300, 0.12, 'sawtooth', 0.2); playTone(220, 0.15, 'sawtooth', 0.2, 0.10); playTone(160, 0.2, 'sawtooth', 0.18, 0.22); },
  pongHit:  () => playTone(560, 0.05, 'square', 0.14),
  pongMiss: () => playTone(200, 0.18, 'sawtooth', 0.2),
  score:    () => { playTone(760, 0.08, 'square', 0.16); playTone(1140, 0.12, 'square', 0.16, 0.07); },
  reveal:   () => playTone(1200, 0.06, 'sine', 0.08),
  peek:     () => playTone(420, 0.4, 'sine', 0.06),
  error:    () => { playTone(160, 0.18, 'sawtooth', 0.24); playTone(110, 0.22, 'sawtooth', 0.22, 0.1); },
  cache:    () => { playTone(880, 0.1, 'triangle', 0.14); playTone(1320, 0.14, 'triangle', 0.14, 0.08); },
  win:      () => [523,659,784,1047,1318].forEach((f,i) => playTone(f, 0.28, 'square', 0.18, i*0.11)),
  fail:     () => [400,320,240,170].forEach((f,i) => playTone(f, 0.28, 'sawtooth', 0.22, i*0.11)),
  alarm:    () => { playTone(900, 0.12, 'square', 0.2); playTone(700, 0.14, 'square', 0.2, 0.1); }
};

function mKick(t, vol){
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(170, t);
  osc.frequency.exponentialRampToValueAtTime(42, t + 0.11);
  g.gain.setValueAtTime(vol || 0.85, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  osc.connect(g); g.connect(musicGain);
  osc.start(t); osc.stop(t + 0.2);
}
function mSnare(t){
  const len = Math.floor(audioCtx.sampleRate * 0.15);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 0.9;
  const g = audioCtx.createGain(); g.gain.value = 0.14;
  src.connect(bp); bp.connect(g); g.connect(musicGain);
  src.start(t); src.stop(t + 0.18);
}
function mHat(t, open){
  const dur = open ? 0.2 : 0.045;
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 7000;
  const g = audioCtx.createGain();
  g.gain.value = open ? 0.11 : 0.07;
  src.connect(hp); hp.connect(g); g.connect(musicGain);
  src.start(t); src.stop(t + dur);
}
function mNote(freq, t, dur, type, vol){
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 4500;
  osc.type = type || 'square';
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);

function musicBPM(){
  if(state === 'menu' || state === 'loading' || state === 'win') return 100;
  if(state === 'phase3') return 158;
  return 140;
}
function musicIntensity(){
  if(state === 'menu' || state === 'loading' || state === 'win') return 1;
  if(state === 'phase3') return 3;
  return 2;
}
function tickMusic(){
  if(!audioCtx || muted) return;
  const bpm = musicBPM();
  const stepDur = 60 / bpm / 4;
  const now = audioCtx.currentTime + 0.03;
  const intensity = musicIntensity();
  const s = musicStep % 16;
  if(KICK[s]) mKick(now, 0.9);
  if(intensity >= 3 && s === 14) mKick(now, 0.6);
  if(HAT[s]) mHat(now, false);
  if(intensity >= 2 && HATO[s]) mHat(now, true);
  if(intensity >= 3 && s % 2 === 1 && !HAT[s]) mHat(now, false);
  if(SNARE[s]) mSnare(now);
  if(intensity >= 3 && s === 12) mSnare(now);
  const bn = BASS[musicStep % BASS.length];
  if(bn !== '-') mNote(N[bn], now, stepDur * 0.95, 'sawtooth', 0.10);
  if(intensity >= 2){
    const an = ARP[musicStep % ARP.length];
    if(an !== '-') mNote(N[an], now, stepDur * 0.65, 'square', 0.038);
  }
  if(intensity >= 3 && Math.floor(musicStep / 16) % 4 >= 2){
    const ln = LEAD[musicStep % LEAD.length];
    if(ln !== '-') mNote(N[ln], now, stepDur * 1.6, 'triangle', 0.055);
  }
  musicStep++;
}
function startMusic(){
  if(musicTimer || !audioCtx) return;
  musicStep = 0;
  let nextTickTime = performance.now();
  const loop = () => {
    if(!audioCtx) return;
    tickMusic();
    const bpm = musicBPM();
    const interval = 60000 / bpm / 4;
    nextTickTime += interval;
    musicTimer = setTimeout(loop, Math.max(0, nextTickTime - performance.now()));
  };
  loop();
}
function stopMusic(){
  if(musicTimer){ clearTimeout(musicTimer); musicTimer = null; }
}

function distPointSeg(x1,y1,x2,y2,cx,cy){const dx=x2-x1,dy=y2-y1;const l2=dx*dx+dy*dy;if(l2===0)return Math.hypot(cx-x1,cy-y1);let t=((cx-x1)*dx+(cy-y1)*dy)/l2;t=t<0?0:t>1?1:t;return Math.hypot(cx-(x1+t*dx),cy-(y1+t*dy));}

function addPopup(x, y, text, color, size){
  popups.push({ x, y, text, color, size: size||22, life: 1.4, max: 1.4, vy: -60, vx: (Math.random()-0.5)*20 });
}
function updatePopups(dt){
  for(let i = popups.length-1; i >= 0; i--){
    const p = popups[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy *= 0.95; p.life -= dt;
    if(p.life <= 0) popups.splice(i, 1);
  }
}
function drawPopups(){
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const p of popups){
    const a = Math.max(0, p.life/p.max);
    const pop = 1 + (1 - Math.min(1, (p.max - p.life)*6)) * 0.28;
    ctx.globalAlpha = a;
    ctx.font = 'bold ' + Math.round(p.size*pop) + 'px Courier New, monospace';
    ctx.shadowColor = p.color; ctx.shadowBlur = 14; ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.restore();
}
function burst(x, y, color, n = 16){
  if(n <= 0) return;
  for(let i = 0; i < n; i++){
    const a = Math.random()*Math.PI*2;
    const sp = 60 + Math.random()*200;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 0.6, max: 0.6, color, r: 1.5 + Math.random()*2.5 });
  }
}
function updateParticles(dt){
  for(let i = particles.length-1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt;
    if(p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles(){
  ctx.save();
  for(const p of particles){
    const a = Math.max(0, p.life/p.max);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*a + 0.5, 0, Math.PI*2); ctx.fill();
  }

}

function makeShields(count, speedMul, sizeAdd, avoidList){
  const arr = [];
  for(let i = 0; i < count; i++){
    const r = (14 + Math.random()*10) + sizeAdd;
    const speed = (70 + Math.random()*40) * speedMul;
    const ang = Math.random()*Math.PI*2;
    let x, y, attempts = 0;
    do {
      x = r + Math.random()*Math.max(1, W - 2*r);
      y = r + Math.random()*Math.max(1, H - 2*r);
      attempts++;
    } while(attempts < 30 && avoidList.some(av =>
      Math.hypot(x - av.x, y - av.y) < (av.r || 100)
    ));
    arr.push({ x, y, vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed, r, rot: Math.random()*Math.PI*2, vr: (Math.random()-0.5)*2.4 });
  }
  return arr;
}

function generateObstacles(count, avoidList){
  const arr = [];
  const maxAttempts = 300;
  for(let i = 0; i < count; i++){
    let placed = false, attempts = 0;
    while(!placed && attempts < maxAttempts){
      attempts++;
      const w = 50 + Math.random()*75;
      const h = 50 + Math.random()*75;
      const x = W*0.10 + Math.random()*Math.max(1, W*0.78 - w);
      const y = H*0.10 + Math.random()*Math.max(1, H*0.78 - h);
      const cx = x + w/2, cy = y + h/2;

      let tooClose = false;
      for(const av of avoidList){
        const rr2 = (av.r || 0);
        if(Math.hypot(cx - av.x, cy - av.y) < rr2){ tooClose = true; break; }
      }
      if(tooClose) continue;

      let overlaps = false;
      for(const o of arr){
        if(x < o.x + o.w + 26 && x + w > o.x - 26 &&
           y < o.y + o.h + 26 && y + h > o.y - 26){
          overlaps = true; break;
        }
      }
      if(overlaps) continue;

      arr.push({ x, y, w, h });
      placed = true;
    }
  }
  return arr;
}

   ========================================================= */
function doorBlocks(x, y){
  if(!door || door.open >= 0.9) return false;
  const cx = door.x + door.w/2;
  const halfW = door.w/2 + 8;
  if(x > cx - halfW && x < cx + halfW && y > door.y - 8 && y < door.y + door.h + 8) return true;
  return false;
}

function isPositionBlocked(x, y){
  for(const o of obstacles){
    if(x > o.x - 6 && x < o.x + o.w + 6 && y > o.y - 6 && y < o.y + o.h + 6) return true;
  }
  if(doorBlocks(x, y)) return true;
  if(!cable) return false;
  const path = cable.path;
  const minDist = 16;
  const skipLast = 6;
  const maxCheck = path.length - skipLast - 1;
  if(maxCheck < 1) return false;
  for(let i = 0; i < maxCheck; i++){
    const p1 = path[i], p2 = path[i+1];
    const minX = Math.min(p1.x, p2.x) - minDist;
    const maxX = Math.max(p1.x, p2.x) + minDist;
    const minY = Math.min(p1.y, p2.y) - minDist;
    const maxY = Math.max(p1.y, p2.y) + minDist;
    if(x < minX || x > maxX || y < minY || y > maxY) continue;
    if(distPointSeg(p1.x, p1.y, p2.x, p2.y, x, y) < minDist) return true;
  }
  return false;
}

function updateButtonShields(dt){
  for(const bs of buttonShields) bs.angle += bs.speed * dt;
}
function getButtonShieldPos(bs){
  return { x: button.x + Math.cos(bs.angle) * bs.orbitR, y: button.y + Math.sin(bs.angle) * bs.orbitR };
}
function checkButtonShieldsVsTip(){
  if(!cable || cable.connected || !button || button.pressed) return;
  for(const bs of buttonShields){
    const pos = getButtonShieldPos(bs);
    const d = Math.hypot(pos.x - cable.tip.x, pos.y - cable.tip.y);
    if(d < bs.r + 10){
      burst(cable.tip.x, cable.tip.y, '#ff3b4e', 22);
      burst(pos.x, pos.y, '#ffd93b', 12);
      resetCable(true);
      return;
    }
  }
}
function updateButton(dt){
  if(!button) return;
  button.pulse += dt * 4;
  if(!button.pressed && cable && !cable.connected){
    const d = Math.hypot(cable.tip.x - button.x, cable.tip.y - button.y);
    if(d < button.r + 4){
      button.pressed = true;
      burst(button.x, button.y, '#2df2ff', 26);
      burst(button.x, button.y, '#39ff88', 16);
      addPopup(button.x, button.y - 55, 'ACESSO LIBERADO', '#2df2ff', 16);
      Sfx.buttonOn();
      sessionScore += 200;
      screenShake = 0.25;
    }
  }
}
function updateDoor(dt){
  if(!door || !button) return;
  if(button.pressed && door.open < 1) door.open = Math.min(1, door.open + dt * 1.3);
}
function updateCable(dt){
  if(!cable) return;
  if(cable.blockSfxCooldown > 0) cable.blockSfxCooldown -= dt;
  if(cable.connected || !cable.dragging) return;

  const tip = cable.tip;
  const dx = cable.targetX - tip.x;
  const dy = cable.targetY - tip.y;
  const dist = Math.hypot(dx, dy);
  if(dist < 2) return;

  const maxSpeed = 620;
  const move = Math.min(dist, maxSpeed * dt);
  const stepX = dx / dist * move;
  const stepY = dy / dist * move;
  const subSteps = Math.max(1, Math.ceil(move / 5));
  let lastX = tip.x, lastY = tip.y;
  let blocked = false;

  for(let i = 0; i < subSteps; i++){
    const nx = lastX + stepX / subSteps;
    const ny = lastY + stepY / subSteps;
    if(nx < 8 || nx > W-8 || ny < 8 || ny > H-8){ blocked = true; break; }
    if(isPositionBlocked(nx, ny)){ blocked = true; break; }
    lastX = nx; lastY = ny;
    const lastP = cable.path[cable.path.length - 1];
    const segLen = Math.hypot(lastX - lastP.x, lastY - lastP.y);
    if(segLen > 4){
      cable.path.push({ x: lastX, y: lastY });
      cable.totalLength += segLen;
    }
  }

  if(blocked && cable.blockSfxCooldown <= 0){
    Sfx.block();
    cable.blockSfxCooldown = 0.18;
    burst(lastX, lastY, '#ffd93b', 4);
  }

  cable.tip.x = lastX;
  cable.tip.y = lastY;
}
function checkCableReachedTarget(){
  if(!cable || !target || cable.connected) return;
  if(!button || !button.pressed) return;
  const cfg = LEVELS[level - 1];
  if(cable.totalLength < cfg.minLength) return;
  const d = Math.hypot(cable.tip.x - target.x, cable.tip.y - target.y);
  if(d < target.r + 4){
    cable.connected = true;
    target.reached = true;
    burst(target.x, target.y, '#39ff88', 30);
    burst(target.x, target.y, '#ffd93b', 20);
    Sfx.connect();
    sessionScore += 300;
    updateHUD();
    completeLevel();
  }
}
function checkShieldVsTip(){
  if(!cable || cable.connected) return;
  for(const s of shields){
    const d = Math.hypot(s.x - cable.tip.x, s.y - cable.tip.y);
    if(d < s.r + 8){
      burst(cable.tip.x, cable.tip.y, '#ff3b4e', 22);
      Sfx.cut();
      failLevel('CABO INTERROMPIDO');
      return;
    }
  }
}
function updateShields(dt){
  for(const s of shields){
    s.x += s.vx*dt; s.y += s.vy*dt; s.rot += s.vr*dt;
    if(s.x < s.r){ s.x = s.r; s.vx = Math.abs(s.vx); }
    if(s.x > W-s.r){ s.x = W-s.r; s.vx = -Math.abs(s.vx); }
    if(s.y < s.r){ s.y = s.r; s.vy = Math.abs(s.vy); }
    if(s.y > H-s.r){ s.y = H-s.r; s.vy = -Math.abs(s.vy); }
    if(Math.random() < 0.010){
      const sp = Math.hypot(s.vx, s.vy);
      const a = Math.atan2(s.vy, s.vx) + (Math.random()-0.5)*0.9;
      s.vx = Math.cos(a)*sp; s.vy = Math.sin(a)*sp;
    }
  }
}
function updateHUD(){
  hudLevel.textContent = level;
  hudTime.textContent = Math.max(0, Math.ceil(timeLeft));
  if(cable){
    const cfg = LEVELS[level - 1];
    const cur = Math.floor(cable.totalLength / 10);
    const min = Math.floor(cfg.minLength / 10);
    if(cable.connected) hudCables.textContent = 'CONECTADO';
    else hudCables.textContent = cur + '/' + min;
    if(cable.totalLength >= cfg.minLength){
      hudCables.classList.add('ok');
      cableBox.classList.add('ok');
    } else {
      hudCables.classList.remove('ok');
      cableBox.classList.remove('ok');
    }
  }
  const pct = clamp((timeLeft / timeTotal)*100, 0, 100);
  timebarFill.style.width = pct + '%';
  timebarFill.style.background = pct < 25 ? '#ff3b4e' : (pct < 50 ? '#ffd93b' : '#39ff88');
  timebarFill.style.color = timebarFill.style.background;
}

/* =========================================================
   FASE 2 — PONG (com velocidade progressiva)
   ========================================================= */
function startPhase2(){
  clearPending();
  phase3 = null;
  alarmOverlay.style.opacity = '0';
  screenShake = 0;
  resetBtn.classList.add('hidden');
  cable = null; target = null; obstacles = []; button = null; door = null; buttonShields = [];

  phase2 = {
    round: 1, maxRounds: PHASE2_ROUNDS.length,
    playerY: 0, playerTargetY: 0, aiY: 0,
    paddleW: 14, paddleH: 90, leftX: 0, rightX: 0,
    playerScore: 0, aiScore: 0, target: 2,
    balls: [], cfg: null, timeLeft: 0, timeTotal: 0,
    roundIntroTimer: 1.8, feedback: '', feedbackTimer: 0, finished: false
  };
  lbl1.textContent = 'RODADA'; lbl2.textContent = 'TEMPO'; lbl3.textContent = 'PONTOS';
  layoutPhase2();
  startPhase2Round(1);
  hud.classList.remove('hidden');
  hideMsg();
  state = 'phase2';
}
function layoutPhase2(){
  if(!phase2) return;
  const p2 = phase2;
  p2.paddleW = Math.max(12, Math.min(18, W*0.014));
  p2.paddleH = Math.max(70, Math.min(130, H*0.20));
  p2.leftX = Math.max(22, W*0.045);
  p2.rightX = W - p2.leftX - p2.paddleW;
  if(p2.playerY === 0) p2.playerY = H/2;
  if(p2.playerTargetY === 0) p2.playerTargetY = H/2;
  if(p2.aiY === 0) p2.aiY = H/2;
}
function startPhase2Round(n){
  const p2 = phase2; if(!p2) return;
  p2.round = n; p2.cfg = PHASE2_ROUNDS[n-1];
  p2.playerScore = 0; p2.aiScore = 0;
  p2.target = p2.cfg.target;
  p2.timeTotal = p2.cfg.time; p2.timeLeft = p2.cfg.time;
  p2.playerY = H/2; p2.playerTargetY = H/2; p2.aiY = H/2;
  p2.balls = []; p2.feedback = ''; p2.feedbackTimer = 0;
  p2.roundIntroTimer = 1.8; p2.finished = false;
  for(let i = 0; i < p2.cfg.balls; i++) spawnBall(i);
  updatePhase2HUD();
}
function spawnBall(index){
  const p2 = phase2; if(!p2) return;
  const speed = p2.cfg.ballSpeed * W;
  const ang = (Math.random()*0.7 - 0.35);
  const dir = Math.random() < 0.5 ? 1 : -1;
  p2.balls.push({
    x: W/2, y: H/2 + (index === 0 ? 0 : (Math.random() < 0.5 ? -60 : 60)),
    vx: Math.cos(ang)*speed*dir, vy: Math.sin(ang)*speed,
    r: 9, trail: [],
    hitCount: 0,
    speedLevel: 0
  });
}
function resetBallAfterScore(b, towardPlayer){
  const p2 = phase2; if(!p2) return;
  const speed = p2.cfg.ballSpeed * W;
  const ang = (Math.random()*0.7 - 0.35);
  const dir = towardPlayer ? -1 : 1;
  b.x = W/2; b.y = H/2 + (Math.random()*120 - 60);
  b.vx = Math.cos(ang)*speed*dir; b.vy = Math.sin(ang)*speed;
  b.trail = [];
  b.hitCount = 0;
  b.speedLevel = 0;
}
function updatePhase2HUD(){
  const p2 = phase2; if(!p2) return;
  hudLevel.textContent = p2.maxRounds === 1 ? '1' : (p2.round + '/' + p2.maxRounds);
  hudTime.textContent = Math.max(0, Math.ceil(p2.timeLeft));
  hudCables.textContent = p2.playerScore + '/' + p2.target;
  hudCables.classList.remove('ok'); cableBox.classList.remove('ok');
  const pct = clamp((p2.timeLeft / p2.timeTotal)*100, 0, 100);
  timebarFill.style.width = pct + '%';
  timebarFill.style.background = pct < 25 ? '#ff3b4e' : (pct < 50 ? '#ffd93b' : '#39ff88');
  timebarFill.style.color = timebarFill.style.background;
}
function updatePhase2Player(y){
  const p2 = phase2; if(!p2) return;
  p2.playerTargetY = clamp(y, p2.paddleH/2 + 6, H - p2.paddleH/2 - 6);
}

/* Aplica progressão de velocidade conforme o número de rebatidas */
function applySpeedProgression(b){
  b.hitCount = (b.hitCount || 0) + 1;
  let mult = 1.0;
  let newLevel = 0;
  if(b.hitCount >= 4){ mult = 2.0; newLevel = 2; }
  else if(b.hitCount >= 2){ mult = 1.5; newLevel = 1; }
  if(newLevel > b.speedLevel){
    b.speedLevel = newLevel;
    const txt = newLevel === 2 ? 'VELOCIDADE 2x!' : 'VELOCIDADE 1.5x!';
    const col = newLevel === 2 ? '#ff3b4e' : '#ffd93b';
    addPopup(b.x, b.y - 32, txt, col, 20);
    Sfx.alarm();
  }
  const baseSpeed = phase2.cfg.ballSpeed * W;
  return Math.max(baseSpeed * 0.9, baseSpeed * mult);
}

function updatePhase2(dt){
  const p2 = phase2;
  if(!p2 || p2.finished) return;
  if(p2.feedbackTimer > 0) p2.feedbackTimer -= dt;
  if(p2.roundIntroTimer > 0){
    p2.roundIntroTimer -= dt;
    p2.playerY += (p2.playerTargetY - p2.playerY) * Math.min(1, dt*22);
    p2.aiY = H/2;
    updatePhase2HUD();
    return;
  }
  p2.timeLeft -= dt;
  if(p2.timeLeft <= 0){
    p2.timeLeft = 0; updatePhase2HUD();
    p2.finished = true; state = 'transition'; Sfx.fail();
    showMsg('TEMPO ESGOTADO', 'fail', 'REINICIANDO FASE 2');
    clearPending();
    pendingTimeout = setTimeout(() => { hideMsg(); startPhase2(); }, 1900);
    return;
  }
  p2.playerY += (p2.playerTargetY - p2.playerY) * Math.min(1, dt*22);

  const aiSpeedPx = p2.cfg.aiSpeed * H;
  let aiTargetY = H/2;
  if(p2.balls.length > 0){
    let best = null, bestD = Infinity;
    for(const b of p2.balls){
      if(b.vx > 0){ const d = Math.abs(W - b.x); if(d < bestD){ bestD = d; best = b; } }
    }
    if(!best){
      let minD = Infinity;
      for(const b of p2.balls){ const d = Math.abs(b.x - W); if(d < minD){ minD = d; best = b; } }
    }
    if(best){
      const err = (Math.random()-0.5) * p2.cfg.aiError * H;
      aiTargetY = best.y + err;
    }
  }
  aiTargetY = clamp(aiTargetY, p2.paddleH/2 + 6, H - p2.paddleH/2 - 6);
  const dyAI = aiTargetY - p2.aiY;
  const maxMove = aiSpeedPx * dt;
  if(Math.abs(dyAI) <= maxMove) p2.aiY = aiTargetY;
  else p2.aiY += Math.sign(dyAI) * maxMove;

  for(let bi = p2.balls.length - 1; bi >= 0; bi--){
    const b = p2.balls[bi];
    b.trail.push({ x: b.x, y: b.y });
    if(b.trail.length > 10) b.trail.shift();
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.y - b.r < 0){ b.y = b.r; b.vy = Math.abs(b.vy); }
    if(b.y + b.r > H){ b.y = H - b.r; b.vy = -Math.abs(b.vy); }

    const py1 = p2.playerY - p2.paddleH/2;
    const py2 = p2.playerY + p2.paddleH/2;
    if(b.vx < 0 && b.x - b.r < p2.leftX + p2.paddleW && b.x + b.r > p2.leftX && b.y + b.r > py1 && b.y - b.r < py2){
      b.x = p2.leftX + p2.paddleW + b.r + 1;
      const off = clamp((b.y - p2.playerY)/(p2.paddleH/2), -1, 1);
      const ang = off*0.9;
      const sp = applySpeedProgression(b);
      b.vx = Math.cos(ang)*sp; b.vy = Math.sin(ang)*sp;
      if(b.vx < 0) b.vx = -b.vx;
      burst(b.x, b.y, '#39ff88', 6); Sfx.pongHit();
    }
    const ay1 = p2.aiY - p2.paddleH/2;
    const ay2 = p2.aiY + p2.paddleH/2;
    if(b.vx > 0 && b.x + b.r > p2.rightX && b.x - b.r < p2.rightX + p2.paddleW && b.y + b.r > ay1 && b.y - b.r < ay2){
      b.x = p2.rightX - b.r - 1;
      const off = clamp((b.y - p2.aiY)/(p2.paddleH/2), -1, 1);
      const ang = off*0.9;
      const sp = applySpeedProgression(b);
      b.vx = -Math.cos(ang)*sp; b.vy = Math.sin(ang)*sp;
      if(b.vx > 0) b.vx = -b.vx;
      burst(b.x, b.y, '#ff3b4e', 6); Sfx.pongHit();
    }
    if(b.x + b.r < -20){
      p2.aiScore++;
      p2.feedback = 'bad'; p2.feedbackTimer = 0.8;
      burst(20, b.y, '#ff3b4e', 20); Sfx.pongMiss();
      resetBallAfterScore(b, false); updatePhase2HUD();
      continue;
    }
    if(b.x - b.r > W + 20){
      p2.playerScore++; sessionScore += 200;
      p2.feedback = 'good'; p2.feedbackTimer = 0.8;
      burst(W-20, b.y, '#39ff88', 20);
      addPopup(W-60, b.y, '+1', '#39ff88', 30); Sfx.score();
      updatePhase2HUD();
      if(p2.playerScore >= p2.target){
        p2.finished = true; state = 'transition'; Sfx.win();
        showMsg('PACOTES INVADIDOS', 'ok', 'FASE 2 CONCLUÍDA');
        clearPending();
        pendingTimeout = setTimeout(() => {
          hideMsg();
          pendingTimeout = setTimeout(() => {
            Sfx.alarm();
            showMsg('ACESSANDO SERVIDOR', 'fail', 'INICIANDO FASE 3');
            pendingTimeout = setTimeout(() => { hideMsg(); startPhase3(); }, 1800);
          }, 400);
        }, 1600);
        return;
      }
      resetBallAfterScore(b, true);
    }
  }
  updatePhase2HUD();
}

/* =========================================================
   FASE 3 — MEMÓRIA
   ========================================================= */
function startPhase3(){
  clearPending();
  phase2 = null;
  alarmOverlay.style.opacity = '0';
  screenShake = 0;
  particles = []; popups = [];
  resetBtn.classList.add('hidden');
  cable = null; target = null; obstacles = []; shields = []; button = null; door = null; buttonShields = [];

  phase3 = {
    round: 1, maxRounds: PHASE3_ROUNDS.length,
    cols: 4, rows: 4, cells: [], cellSize: 0, gap: 0, gridX: 0, gridY: 0,
    legendX: 0, legendW: 0, data: 0, target: 8,
    alarm: 0, alarmMax: 100, alarmPulse: 0,
    combo: 0, bestCombo: 0, comboTimer: 0,
    pulseTimer: 0, pulseActive: 0, timeLeft: 0, timeTotal: 0,
    roundIntroTimer: 3.0, cfg: null, finished: false, hintTimer: 6.0
  };
  lbl1.textContent = 'RODADA'; lbl2.textContent = 'TEMPO'; lbl3.textContent = 'DADOS';
  layoutPhase3();
  startPhase3Round(1);
  hud.classList.remove('hidden');
  hideMsg();
  state = 'phase3';
}
function layoutPhase3(){
  if(!phase3) return;
  const p3 = phase3;
  p3.legendW = clamp(W*0.22, 84, 120);
  const legendPad = 8, gridLeftPad = 12;
  const availW = W - p3.legendW - legendPad - gridLeftPad - 12;
  const availH = Math.min(H*0.52, 520);
  const gapRatio = 0.10;
  const sizeByW = (availW - (p3.cols-1)*(availW*gapRatio/p3.cols))/p3.cols;
  const sizeByH = (availH - (p3.rows-1)*8)/p3.rows;
  p3.cellSize = Math.floor(Math.min(sizeByW, sizeByH));
  p3.gap = Math.round(p3.cellSize * gapRatio);
  const gridW = p3.cols*p3.cellSize + (p3.cols-1)*p3.gap;
  const gridH = p3.rows*p3.cellSize + (p3.rows-1)*p3.gap;
  p3.gridX = gridLeftPad + Math.max(0, (availW - gridW)/2);
  p3.gridY = H/2 - gridH/2 + 40;
  p3.legendX = W - p3.legendW - legendPad;
}
function pickCellType(cfg){
  const r = Math.random();
  if(r < cfg.chanceFire) return 'firewall';
  if(r < cfg.chanceFire + cfg.chanceCache) return 'cache';
  if(r < cfg.chanceFire + cfg.chanceCache + cfg.chanceEnc) return 'encrypted';
  return 'data';
}
function startPhase3Round(n){
  const p3 = phase3; if(!p3) return;
  p3.round = n; p3.cfg = PHASE3_ROUNDS[n-1];
  p3.target = p3.cfg.target; p3.data = 0; p3.alarm = 0; p3.alarmPulse = 0;
  p3.combo = 0; p3.bestCombo = 0; p3.comboTimer = 0;
  p3.pulseTimer = p3.cfg.pulseEvery; p3.pulseActive = 0;
  p3.timeTotal = p3.cfg.time; p3.timeLeft = p3.cfg.time;
  p3.roundIntroTimer = 3.0; p3.finished = false; p3.hintTimer = 6.0;
  p3.cells = [];
  const total = p3.cols*p3.rows;
  for(let i = 0; i < total; i++){
    p3.cells.push({ type: pickCellType(p3.cfg), revealed: 0, revealTarget: 0, spawnReveal: 0, flash: 0, flashType: null, emptyTimer: 0, spawnAnim: 0, spawnDelay: i*0.03, shake: 0, breathe: Math.random()*Math.PI*2 });
  }
  layoutPhase3();
  updatePhase3HUD();
  alarmOverlay.style.opacity = '0';
  screenShake = 0;
}
function updatePhase3HUD(){
  const p3 = phase3; if(!p3) return;
  hudLevel.textContent = p3.round + '/' + p3.maxRounds;
  hudTime.textContent = Math.max(0, Math.ceil(p3.timeLeft));
  hudCables.textContent = p3.data + '/' + p3.target;
  hudCables.classList.remove('ok'); cableBox.classList.remove('ok');
  const pct = clamp((p3.timeLeft / p3.timeTotal)*100, 0, 100);
  timebarFill.style.width = pct + '%';
  timebarFill.style.background = pct < 25 ? '#ff3b4e' : (pct < 50 ? '#ffd93b' : '#39ff88');
  timebarFill.style.color = timebarFill.style.background;
}
function handlePhase3RoundComplete(){
  const p3 = phase3; if(!p3 || p3.finished) return;
  p3.finished = true; state = 'transition';
  alarmOverlay.style.opacity = '0'; Sfx.win();
  showMsg(p3.round + ' / ' + p3.maxRounds, 'ok', 'DADOS EXTRAÍDOS');
  clearPending();
  if(p3.round >= p3.maxRounds){
    pendingTimeout = setTimeout(() => { hideMsg(); endGame(); }, 1600);
  } else {
    pendingTimeout = setTimeout(() => { hideMsg(); startPhase3Round(p3.round+1); state = 'phase3'; }, 1600);
  }
}
function handlePhase3Fail(reason){
  const p3 = phase3; if(!p3 || p3.finished) return;
  p3.finished = true; state = 'transition';
  alarmOverlay.style.opacity = '0';
  burst(W/2, H/2, '#ff3b4e', 24); screenShake = 0.7; Sfx.fail();
  showMsg(reason, 'fail', 'REINICIANDO FASE 3');
  clearPending();
  pendingTimeout = setTimeout(() => { hideMsg(); startPhase3(); }, 1900);
}
function triggerPulse(){
  const p3 = phase3; if(!p3) return;
  p3.pulseActive = p3.cfg.pulseDuration; Sfx.peek();
  const n = p3.cells.length;
  const candidates = [];
  for(let i = 0; i < n; i++){
    const c = p3.cells[i];
    if(c.emptyTimer <= 0 && c.spawnDelay <= 0 && c.spawnReveal <= 0) candidates.push(i);
  }
  if(candidates.length >= 2){
    const swaps = Math.random() < 0.5 ? 1 : 2;
    for(let k = 0; k < swaps; k++){
      const a = candidates[Math.floor(Math.random()*candidates.length)];
      let b = candidates[Math.floor(Math.random()*candidates.length)];
      let tr = 0;
      while(b === a && tr < 12){ b = candidates[Math.floor(Math.random()*candidates.length)]; tr++; }
      if(a === b) continue;
      const ca = p3.cells[a], cb = p3.cells[b];
      const tmp = ca.type; ca.type = cb.type; cb.type = tmp;
    }
  }
}
function updatePhase3(dt){
  const p3 = phase3; if(!p3 || p3.finished) return;
  if(p3.hintTimer > 0) p3.hintTimer -= dt;
  if(p3.alarmPulse > 0) p3.alarmPulse = Math.max(0, p3.alarmPulse - dt*2.2);
  if(p3.combo > 0){ p3.comboTimer -= dt; if(p3.comboTimer <= 0){ p3.combo = 0; } }
  if(p3.roundIntroTimer <= 0){
    p3.pulseTimer -= dt;
    if(p3.pulseTimer <= 0){ triggerPulse(); p3.pulseTimer = p3.cfg.pulseEvery; }
    if(p3.pulseActive > 0) p3.pulseActive -= dt;
  }
  const inPulse = p3.pulseActive > 0;
  const inIntro = p3.roundIntroTimer > 0;
  for(const c of p3.cells){
    if(c.flash > 0) c.flash = Math.max(0, c.flash - dt*3.2);
    if(c.shake > 0) c.shake = Math.max(0, c.shake - dt*2.8);
    c.breathe += dt*1.6;
    if(c.spawnDelay > 0){ c.spawnDelay -= dt; }
    else if(c.spawnAnim < 1){ c.spawnAnim = Math.min(1, c.spawnAnim + dt*4); }
    if(c.spawnReveal > 0) c.spawnReveal -= dt;
    if(c.emptyTimer > 0){
      c.emptyTimer -= dt;
      if(c.emptyTimer <= 0){ c.type = pickCellType(p3.cfg); c.spawnAnim = 0; c.spawnDelay = 0.05; c.spawnReveal = 0.7; }
    }
    let tg = 0;
    if(inIntro || inPulse) tg = 1;
    if(c.spawnReveal > 0) tg = 1;
    c.revealTarget = tg;
    c.revealed += (c.revealTarget - c.revealed) * Math.min(1, dt*9);
    if(c.revealed < 0) c.revealed = 0;
    if(c.revealed > 1) c.revealed = 1;
  }
  if(inIntro){ p3.roundIntroTimer -= dt; updatePhase3HUD(); return; }
  p3.timeLeft -= dt;
  if(p3.timeLeft <= 0){ p3.timeLeft = 0; updatePhase3HUD(); handlePhase3Fail('TEMPO ESGOTADO'); return; }
  p3.alarm = Math.max(0, p3.alarm - p3.cfg.alarmDecay * dt);
  const a = clamp(p3.alarm / p3.alarmMax, 0, 1);
  alarmOverlay.style.opacity = (a*a*0.85).toFixed(3);
  if(p3.alarm >= p3.alarmMax){ handlePhase3Fail('ALARME DISPARADO'); return; }
  updatePhase3HUD();
}
function phase3Tap(x, y){
  const p3 = phase3; if(!p3 || p3.finished) return;
  if(p3.roundIntroTimer > 0) return;
  if(state !== 'phase3') return;
  for(let i = 0; i < p3.cells.length; i++){
    const c = p3.cells[i];
    const col = i % p3.cols;
    const row = Math.floor(i / p3.cols);
    const cx = p3.gridX + col*(p3.cellSize + p3.gap);
    const cy = p3.gridY + row*(p3.cellSize + p3.gap);
    if(x >= cx && x <= cx + p3.cellSize && y >= cy && y <= cy + p3.cellSize){
      if(c.emptyTimer > 0 || c.spawnAnim < 0.4 || c.flash > 0.15) return;
      const ccx = cx + p3.cellSize/2, ccy = cy + p3.cellSize/2;
      if(c.type === 'data'){
        p3.data++; sessionScore += 25;
        p3.alarm = Math.min(p3.alarmMax, p3.alarm + p3.cfg.dataAlarm);
        p3.alarmPulse = Math.max(p3.alarmPulse, 0.5);
        p3.combo++; p3.comboTimer = 2.5;
        if(p3.combo > p3.bestCombo) p3.bestCombo = p3.combo;
        c.flash = 1; c.flashType = 'good'; c.emptyTimer = 0.5; c.spawnAnim = 1;
        burst(ccx, ccy, '#39ff88', 12);
        addPopup(ccx, ccy-10, '+1', '#39ff88', 26); Sfx.score();
        if(p3.combo > 0 && p3.combo % 4 === 0){
          p3.data++; sessionScore += 50;
          burst(ccx, ccy, '#ffd93b', 16);
          addPopup(ccx, ccy-40, 'COMBO x' + p3.combo + '!', '#ffd93b', 18); Sfx.cache();
        }
      } else if(c.type === 'encrypted'){
        p3.data += 2; sessionScore += 50;
        p3.alarm = Math.min(p3.alarmMax, p3.alarm + p3.cfg.encAlarm);
        p3.alarmPulse = Math.max(p3.alarmPulse, 0.6);
        p3.combo++; p3.comboTimer = 2.5;
        if(p3.combo > p3.bestCombo) p3.bestCombo = p3.combo;
        c.flash = 1; c.flashType = 'good'; c.emptyTimer = 0.55; c.spawnAnim = 1;
        burst(ccx, ccy, '#3ba7ff', 16);
        addPopup(ccx, ccy-10, '+2', '#3ba7ff', 28); Sfx.score();
        if(p3.combo > 0 && p3.combo % 4 === 0){
          p3.data++; sessionScore += 50;
          burst(ccx, ccy, '#ffd93b', 16);
          addPopup(ccx, ccy-40, 'COMBO x' + p3.combo + '!', '#ffd93b', 18); Sfx.cache();
        }
      } else if(c.type === 'cache'){
        p3.alarm = Math.max(0, p3.alarm - p3.cfg.cacheRelief); sessionScore += 10;
        c.flash = 1; c.flashType = 'cache'; c.emptyTimer = 0.55; c.spawnAnim = 1;
        burst(ccx, ccy, '#ffd93b', 20);
        addPopup(ccx, ccy-10, '-' + p3.cfg.cacheRelief + '%', '#ffd93b', 24); Sfx.cache();
      } else {
        p3.alarm = Math.min(p3.alarmMax, p3.alarm + p3.cfg.secAlarm);
        sessionScore = Math.max(0, sessionScore - 30);
        p3.alarmPulse = 1.0; p3.combo = 0;
        c.flash = 1; c.flashType = 'bad'; c.shake = 1; c.emptyTimer = 0.65; c.spawnAnim = 1;
        burst(ccx, ccy, '#ff3b4e', 18);
        addPopup(ccx, ccy-10, '+' + p3.cfg.secAlarm + '%', '#ff3b4e', 22); Sfx.error();
        screenShake = Math.max(screenShake, 0.4);
      }
      updatePhase3HUD();
      if(p3.data >= p3.target){ handlePhase3RoundComplete(); }
      else if(p3.alarm >= p3.alarmMax){ handlePhase3Fail('ALARME DISPARADO'); }
      return;
    }
  }
}

function endGame(){
  Sfx.win();
  stopMusic();
  const timeBonus = Math.max(0, Math.floor(timeLeft) * 3);
  sessionScore += timeBonus;
  lastGameScore = sessionScore;

  hud.classList.add('hidden');
  pauseBtn.classList.add('hidden');
  muteBtn.classList.add('hidden');
  resetBtn.classList.add('hidden');
  state = 'win';

  finalScoreEl.textContent = sessionScore;
  winAgentTag.textContent = 'AGENTE: ' + playerNameGlobal;

  const mode = saveScore(playerNameGlobal, sessionScore);
  if(mode === 'local'){ saveBadge.className = 'save-badge'; saveBadge.textContent = '✓ PONTUAÇÃO SALVA NO RANKING'; }
  else if(mode === 'memory'){ saveBadge.className = 'save-badge warn'; saveBadge.textContent = '⚠ SALVA APENAS NESTA SESSÃO'; }
  else { saveBadge.className = 'save-badge err'; saveBadge.textContent = '✗ ERRO AO SALVAR'; }

  winScreen.classList.remove('hidden');
}
