/* =========================================================
   PAUSE / MUTE / RESET
   ========================================================= */
function togglePause(){
  if(state === 'menu' || state === 'loading' || state === 'win') return;
  if(state === 'paused'){
    if(prevState) state = prevState;
    else state = 'playing';
    prevState = null;
    pauseOverlay.classList.add('hidden');
  } else {
    prevState = state;
    state = 'paused';
    pauseOverlay.classList.remove('hidden');
  }
}
pauseBtn.addEventListener('click', (e) => { e.stopPropagation(); ensureAudio(); Sfx.click(); togglePause(); });
document.getElementById('btnResume').addEventListener('click', () => { Sfx.click(); togglePause(); });
document.getElementById('btnPauseMenu').addEventListener('click', () => { Sfx.click(); prevState = null; pauseOverlay.classList.add('hidden'); resetToMenu(); });
muteBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  muted = !muted;
  if(masterGain) masterGain.gain.value = muted ? 0 : 0.32;
  muteBtn.textContent = muted ? '🔇' : '🔊';
});
resetBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  ensureAudio(); Sfx.click();
  if(state !== 'playing' || !cable) return;
  resetCable(true);
});

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt){
  if(state === 'paused') return;
  updateParticles(dt);
  updatePopups(dt);
  if(cutCooldown > 0) cutCooldown -= dt;
  if(screenShake > 0) screenShake = Math.max(0, screenShake - dt*2.2);

  if(state === 'playing'){
    if(invuln > 0) invuln -= dt;
    timeLeft -= dt;
    if(timeLeft <= 0){ timeLeft = 0; updateHUD(); failLevel('TEMPO ESGOTADO'); return; }
    updateCable(dt);
    updateButtonShields(dt);
    updateButton(dt);
    updateDoor(dt);
    updateShields(dt);
    checkButtonShieldsVsTip();
    checkShieldVsTip();
    checkCableReachedTarget();
    updateHUD();
  } else if(state === 'transition'){
    if(phase3) updatePhase3(dt);
    else if(phase2) updatePhase2(dt);
    else { updateCable(dt); updateButtonShields(dt); updateDoor(dt); updateShields(dt); }
  } else if(state === 'phase2'){ updatePhase2(dt); }
  else if(state === 'phase3'){ updatePhase3(dt); }
}

/* =========================================================
   RENDER
   ========================================================= */
function drawGrid(){
  const step = 44;
  ctx.save();
  ctx.strokeStyle = 'rgba(0,255,150,0.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x = 0; x <= W; x += step){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for(let y = 0; y <= H; y += step){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  const t = performance.now() * 0.00035;
  ctx.strokeStyle = 'rgba(0,255,180,0.05)';
  for(let i = 0; i < 3; i++){
    const y = ((t + i/3) % 1) * H;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
}
function drawBackground(){
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H)*0.75);
  g.addColorStop(0, '#061410'); g.addColorStop(1, '#02060a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawGrid();
}

function drawObstacles(){
  for(const o of obstacles){
    ctx.save();
    ctx.shadowColor = '#ff3b4e'; ctx.shadowBlur = 14;
    rr(ctx, o.x, o.y, o.w, o.h, 8);
    ctx.fillStyle = 'rgba(30,8,15,0.95)'; ctx.fill();
    ctx.strokeStyle = '#ff3b4e'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.save();
    rr(ctx, o.x, o.y, o.w, o.h, 8); ctx.clip();
    ctx.strokeStyle = 'rgba(255,59,78,0.28)'; ctx.lineWidth = 2;
    for(let i = -o.h; i < o.w + o.h; i += 18){
      ctx.beginPath();
      ctx.moveTo(o.x + i, o.y);
      ctx.lineTo(o.x + i + o.h, o.y + o.h);
      ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
  }
}

function drawButtonShield(bs, pos){
  ctx.save();
  ctx.translate(pos.x, pos.y);
  ctx.rotate(bs.angle * 2);
  ctx.shadowColor = '#ff3b4e'; ctx.shadowBlur = 18;
  ctx.strokeStyle = '#ff5c7a'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for(let i = 0; i < 6; i++){
    const a = i * Math.PI / 3;
    const x = Math.cos(a) * bs.r, y = Math.sin(a) * bs.r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,45,85,0.28)'; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,150,170,0.9)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-bs.r*0.32, -bs.r*0.32); ctx.lineTo(bs.r*0.32, bs.r*0.32);
  ctx.moveTo(bs.r*0.32, -bs.r*0.32); ctx.lineTo(-bs.r*0.32, bs.r*0.32);
  ctx.stroke();
  ctx.restore();
}

function drawButton(){
  if(!button) return;
  const b = button;
  if(!b.pressed && buttonShields.length > 0){
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.beginPath();
    ctx.arc(0, 0, LEVELS[level-1].buttonShieldRadius, 0, Math.PI * 2);
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(255,59,78,0.28)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  const pulseR = b.r + 6 + Math.sin(b.pulse) * 5;
  ctx.save();
  ctx.translate(b.x, b.y);
  if(!b.pressed){
    ctx.beginPath(); ctx.arc(0, 0, pulseR, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(45,242,255,0.45)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, pulseR + 10, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(45,242,255,0.18)'; ctx.lineWidth = 2; ctx.stroke();
  }
  const color = b.pressed ? '#39ff88' : '#2df2ff';
  ctx.shadowColor = color;
  ctx.shadowBlur = b.pressed ? 30 : 20;
  ctx.beginPath();
  ctx.arc(0, 0, b.r, 0, Math.PI * 2);
  ctx.fillStyle = b.pressed ? 'rgba(10,55,30,0.95)' : 'rgba(8,30,45,0.95)';
  ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.arc(0, 0, b.r*0.55, -Math.PI*0.35, Math.PI*1.35);
  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -b.r*0.65); ctx.lineTo(0, -b.r*0.10);
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
  if(b.pressed){
    ctx.strokeStyle = '#39ff88'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-b.r*0.3, 0); ctx.lineTo(-b.r*0.05, b.r*0.25); ctx.lineTo(b.r*0.35, -b.r*0.25);
    ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = 'bold 10px Courier New, monospace';
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 8;
  ctx.fillText(b.pressed ? 'ATIVO' : 'ATIVAR', 0, b.r + 10);
  ctx.restore();
}

function drawDoor(){
  if(!door) return;
  const alpha = 1 - door.open;
  if(alpha < 0.02) return;
  const w = door.w * (1 - door.open * 0.7);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = '#ffd93b'; ctx.shadowBlur = 18;
  const cx = door.x + door.w/2;
  rr(ctx, cx - w/2, door.y, w, door.h, 5);
  ctx.fillStyle = 'rgba(30,22,4,0.95)'; ctx.fill();
  ctx.strokeStyle = '#ffd93b'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.save();
  rr(ctx, cx - w/2, door.y, w, door.h, 5); ctx.clip();
  ctx.strokeStyle = 'rgba(255,217,59,0.35)'; ctx.lineWidth = 2;
  for(let yy = door.y - door.w; yy < door.y + door.h + door.w; yy += 16){
    ctx.beginPath();
    ctx.moveTo(cx - w/2 - 4, yy); ctx.lineTo(cx + w/2 + 4, yy + 20);
    ctx.stroke();
  }
  ctx.restore();
  if(button && !button.pressed){
    ctx.save();
    ctx.translate(cx, door.y + door.h/2); ctx.rotate(Math.PI/2);
    ctx.beginPath(); ctx.arc(0, -5, 9, Math.PI, 0);
    ctx.lineWidth = 3.5; ctx.strokeStyle = '#ffd93b'; ctx.stroke();
    ctx.fillStyle = '#ffd93b'; ctx.fillRect(-12, -2, 24, 18);
    ctx.fillStyle = 'rgba(30,22,4,0.95)';
    ctx.beginPath(); ctx.arc(0, 5, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(-1.2, 5, 2.4, 7);
    ctx.restore();
  }
  ctx.restore();
}

function drawTarget(){
  if(!target) return;
  const t = target;
  const r = t.r;
  const pulse = 1 + Math.sin(performance.now() * 0.005) * 0.08;
  const cfg = LEVELS[level - 1];
  const lengthOK = cable && cable.totalLength >= cfg.minLength;
  const locked = !button || !button.pressed || !lengthOK;

  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.scale(pulse, pulse);
  if(!t.reached && !locked){
    ctx.beginPath();
    ctx.arc(0, 0, r + 8 + Math.sin(performance.now() * 0.004) * 6, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,217,59,0.25)'; ctx.lineWidth = 2; ctx.stroke();
  }
  const mainColor = t.reached ? '#39ff88' : (locked ? '#5a5a3a' : '#ffd93b');
  ctx.shadowColor = mainColor;
  ctx.shadowBlur = t.reached ? 40 : (locked ? 8 : 30);
  ctx.strokeStyle = mainColor; ctx.lineWidth = 3;
  ctx.beginPath();
  for(let i = 0; i < 6; i++){
    const a = Math.PI/6 + i*Math.PI/3;
    const x = Math.cos(a)*r, y = Math.sin(a)*r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.beginPath();
  for(let i = 0; i < 6; i++){
    const a = Math.PI/6 + i*Math.PI/3;
    const x = Math.cos(a)*(r-2), y = Math.sin(a)*(r-2);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = t.reached ? 'rgba(57,255,136,0.3)' : (locked ? 'rgba(90,90,58,0.15)' : 'rgba(255,217,59,0.15)');
  ctx.fill();
  if(locked){
    ctx.beginPath(); ctx.arc(0, -3, 5, Math.PI, 0);
    ctx.strokeStyle = mainColor; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = mainColor; ctx.fillRect(-6.5, -3, 13, 10);
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.beginPath(); ctx.arc(0, 2, 1.5, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI*2);
    ctx.fillStyle = mainColor; ctx.fill();
  }
  ctx.restore();
}

function drawCablePath(){
  if(!cable || cable.path.length < 2) return;
  const path = cable.path;
  const cfg = LEVELS[level - 1];
  const lengthOK = cable.totalLength >= cfg.minLength;
  const mainColor = lengthOK ? '#39ff88' : '#ffd93b';

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = mainColor;
  ctx.shadowBlur = 18;
  ctx.strokeStyle = mainColor;
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);
  for(let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();
}

function drawCableBase(){
  if(!cable) return;
  const p = cable.path[0];
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.shadowColor = '#39ff88'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(6,18,14,0.95)'; ctx.fill();
  ctx.strokeStyle = '#39ff88'; ctx.lineWidth = 3; ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2);
  ctx.fillStyle = '#39ff88'; ctx.fill();
  ctx.restore();
}

function getTipDanger(){
  if(!cable) return 0;
  let minD = Infinity;
  for(const s of shields){
    const d = Math.hypot(s.x - cable.tip.x, s.y - cable.tip.y);
    if(d < minD) minD = d;
  }
  if(button && !button.pressed){
    for(const bs of buttonShields){
      const pos = getButtonShieldPos(bs);
      const d = Math.hypot(pos.x - cable.tip.x, pos.y - cable.tip.y) - bs.r;
      if(d < minD) minD = d;
    }
  }
  if(minD < 130) return 1 - minD / 130;
  return 0;
}

function drawCableTip(){
  if(!cable) return;
  const tip = cable.tip;
  const danger = getTipDanger();
  let baseColor = '#39ff88';
  if(cable.connected) baseColor = '#39ff88';
  else if(danger > 0.4) baseColor = '#ff3b4e';
  else if(danger > 0.1) baseColor = '#ffd93b';

  ctx.save();
  ctx.translate(tip.x, tip.y);
  const pulse = 1 + Math.sin(performance.now() * 0.008) * 0.1;
  ctx.scale(pulse, pulse);

  if(danger > 0.05 && !cable.connected){
    ctx.beginPath();
    ctx.arc(0, 0, 22 + danger * 10, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,59,78,${danger * 0.6})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.shadowColor = baseColor;
  ctx.shadowBlur = cable.dragging ? 30 : 15;
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI * 2);
  ctx.fillStyle = cable.dragging ? baseColor : '#08130f';
  ctx.fill();
  ctx.strokeStyle = baseColor; ctx.lineWidth = 3; ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(0, 0, 5, 0, Math.PI * 2);
  ctx.fillStyle = cable.dragging ? '#ffffff' : baseColor;
  ctx.fill();
  ctx.restore();
}

function drawShield(s){
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
  ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 22;
  ctx.strokeStyle = '#ff5c7a'; ctx.lineWidth = 3;
  ctx.beginPath();
  for(let i = 0; i < 6; i++){
    const a = i * Math.PI / 3;
    const x = Math.cos(a)*s.r, y = Math.sin(a)*s.r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,45,85,0.16)'; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,120,145,0.85)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-s.r*0.35, -s.r*0.35); ctx.lineTo(s.r*0.35, s.r*0.35);
  ctx.moveTo(s.r*0.35, -s.r*0.35); ctx.lineTo(-s.r*0.35, s.r*0.35);
  ctx.stroke();
  ctx.restore();
}

function renderPhase1(){
  drawObstacles();
  drawTarget();
  drawDoor();
  drawCablePath();
  drawCableBase();
  drawCableTip();
  if(button && !button.pressed){
    for(const bs of buttonShields){
      drawButtonShield(bs, getButtonShieldPos(bs));
    }
  }
  drawButton();
  shields.forEach(drawShield);

  if(state === 'playing' && invuln > 0){
    const cfg = LEVELS[level - 1];
    ctx.save();
    ctx.globalAlpha = Math.min(1, invuln) * 0.9;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 13px Courier New, monospace';
    ctx.fillStyle = '#8affc0';
    ctx.shadowColor = '#39ff88'; ctx.shadowBlur = 12;
    ctx.fillText('ESTENDA O CABO — ATIVE O BOTÃO — ALCANCE O ALVO', W/2, H - 54);
    ctx.font = 'bold 11px Courier New, monospace';
    ctx.fillStyle = '#ffd93b';
    ctx.fillText('CABO MÍN: ' + Math.floor(cfg.minLength/10) + 'm  •  EVITE OS ESCUDOS DO BOTÃO', W/2, H - 34);
    ctx.restore();
  }
}

function renderPhase2(){
  const p2 = phase2; if(!p2) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(57,255,136,0.22)'; ctx.lineWidth = 2;
  ctx.setLineDash([10, 14]);
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + Math.floor(Math.min(W, H) * 0.22) + 'px Courier New, monospace';
  ctx.fillStyle = 'rgba(57,255,136,0.06)'; ctx.fillText(p2.playerScore, W*0.30, H/2);
  ctx.fillStyle = 'rgba(255,59,78,0.06)'; ctx.fillText(p2.aiScore, W*0.70, H/2);
  ctx.restore();
  ctx.save();
  ctx.shadowColor = '#39ff88'; ctx.shadowBlur = 22;
  rr(ctx, p2.leftX, p2.playerY - p2.paddleH/2, p2.paddleW, p2.paddleH, 6);
  ctx.fillStyle = '#39ff88'; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillRect(p2.leftX + 2, p2.playerY - p2.paddleH/2 + 4, 2, p2.paddleH - 8);
  ctx.restore();
  ctx.save();
  ctx.shadowColor = '#ff3b4e'; ctx.shadowBlur = 22;
  rr(ctx, p2.rightX, p2.aiY - p2.paddleH/2, p2.paddleW, p2.paddleH, 6);
  ctx.fillStyle = '#ff3b4e'; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillRect(p2.rightX + p2.paddleW - 4, p2.aiY - p2.paddleH/2 + 4, 2, p2.paddleH - 8);
  ctx.restore();
  for(const b of p2.balls){
    for(let i = 0; i < b.trail.length; i++){
      const t = b.trail[i];
      const a = (i + 1) / b.trail.length;
      ctx.save(); ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = '#2df2ff'; ctx.shadowColor = '#2df2ff'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(t.x, t.y, b.r*a*0.85, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    /* Cor da bola muda conforme a velocidade */
    let ballColor = '#2df2ff';
    if(b.speedLevel === 1) ballColor = '#ffd93b';
    else if(b.speedLevel === 2) ballColor = '#ff3b4e';

    ctx.save();
    ctx.shadowColor = ballColor; ctx.shadowBlur = 26 + (b.speedLevel || 0) * 8;
    ctx.fillStyle = ballColor;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x - b.r*0.25, b.y - b.r*0.25, b.r*0.45, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  if(p2.feedback && p2.feedbackTimer > 0){
    const a = Math.min(1, p2.feedbackTimer) * 0.18;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = p2.feedback === 'bad' ? '#ff3b4e' : '#39ff88';
    ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  if(p2.roundIntroTimer > 0){
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#8affc0';
    ctx.font = 'bold clamp(28px, 6vw, 52px) Courier New, monospace';
    ctx.shadowColor = '#39ff88'; ctx.shadowBlur = 30;
    ctx.fillText('DEFESA DE PACOTES', W/2, H/2 - 40);
    ctx.font = 'bold 14px Courier New, monospace';
    ctx.fillStyle = '#3f8a63'; ctx.shadowBlur = 0;
    ctx.fillText('DEFENDA A ESQUERDA — MARQUE ' + p2.target + ' PONTOS', W/2, H/2 + 6);
    ctx.fillStyle = '#ffd93b';
    ctx.font = 'bold 12px Courier New, monospace';
    ctx.fillText('2 REBATIDAS = 1.5x  •  4 REBATIDAS = 2x', W/2, H/2 + 34);
    ctx.restore();
  }
}

/* --- Ícones fase 3 --- */
function drawDataIcon(size){
  const w = size*0.85, h = size*1.0, fold = size*0.28;
  ctx.beginPath();
  ctx.moveTo(-w/2, -h/2); ctx.lineTo(w/2 - fold, -h/2);
  ctx.lineTo(w/2, -h/2 + fold); ctx.lineTo(w/2, h/2);
  ctx.lineTo(-w/2, h/2); ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.96)'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(w/2 - fold, -h/2); ctx.lineTo(w/2 - fold, -h/2 + fold); ctx.lineTo(w/2, -h/2 + fold);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,120,60,0.55)'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,80,40,0.8)';
  ctx.lineWidth = Math.max(1.5, size*0.07);
  for(let i = 0; i < 3; i++){
    const y = -h*0.10 + i*h*0.22;
    ctx.beginPath(); ctx.moveTo(-w*0.30, y); ctx.lineTo(w*0.30, y); ctx.stroke();
  }
}
function drawEncryptedIcon(size){
  const r = size*0.7;
  ctx.beginPath(); ctx.arc(0, -r*0.25, r*0.5, Math.PI, 0);
  ctx.lineWidth = Math.max(3, size*0.14);
  ctx.strokeStyle = 'rgba(255,255,255,0.96)'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.96)'; ctx.fillRect(-r*0.75, -r*0.1, r*1.5, r*1.05);
  ctx.fillStyle = 'rgba(0,40,90,0.95)';
  ctx.beginPath(); ctx.arc(0, r*0.32, r*0.15, 0, Math.PI*2); ctx.fill();
  ctx.fillRect(-r*0.07, r*0.32, r*0.14, r*0.4);
}
function drawFirewallIcon(size){
  const r = size*0.85;
  ctx.beginPath();
  for(let i = 0; i < 6; i++){
    const a = -Math.PI/2 + i*Math.PI/3;
    const x = Math.cos(a)*r, y = Math.sin(a)*r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.96)'; ctx.fill();
  ctx.fillStyle = 'rgba(140,0,25,0.95)';
  const bw = r*0.22, bh = r*0.95;
  ctx.beginPath();
  ctx.moveTo(-bw/2, -bh*0.55); ctx.lineTo(bw/2, -bh*0.55);
  ctx.lineTo(bw*0.35, bh*0.05); ctx.lineTo(-bw*0.35, bh*0.05);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(0, bh*0.35, bw*0.65, 0, Math.PI*2); ctx.fill();
}
function drawCacheIcon(size){
  const r = size*0.9;
  const points = 5;
  ctx.beginPath();
  for(let i = 0; i < points*2; i++){
    const radius = i % 2 === 0 ? r : r*0.45;
    const a = -Math.PI/2 + i*Math.PI/points;
    const x = Math.cos(a)*radius, y = Math.sin(a)*radius;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.96)'; ctx.fill();
  ctx.beginPath(); ctx.arc(-r*0.15, -r*0.15, r*0.22, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,220,120,0.85)'; ctx.fill();
}
const CELL_STYLE = {
  data: { stroke: '#39ff88', strokeRGB: [57,255,136], bg: [10,55,30], icon: drawDataIcon },
  encrypted: { stroke: '#3ba7ff', strokeRGB: [59,167,255], bg: [10,32,68], icon: drawEncryptedIcon },
  firewall: { stroke: '#ff3b4e', strokeRGB: [255,59,78], bg: [58,10,22], icon: drawFirewallIcon },
  cache: { stroke: '#ffd93b', strokeRGB: [255,217,59], bg: [58,45,8], icon: drawCacheIcon }
};

function renderLegend(){
  const p3 = phase3; if(!p3) return;
  const lx = p3.legendX, ly = p3.gridY, lw = p3.legendW;
  const cs = p3.cellSize;
  const rowH = Math.min(cs*1.15, (p3.rows*cs + (p3.rows-1)*p3.gap)/4);
  ctx.save();
  const totalH = rowH*4;
  rr(ctx, lx-4, ly-6, lw+8, totalH+12, 8);
  ctx.fillStyle = 'rgba(2,10,7,0.75)'; ctx.fill();
  ctx.strokeStyle = 'rgba(57,255,136,0.28)'; ctx.lineWidth = 1.2;
  rr(ctx, lx-4, ly-6, lw+8, totalH+12, 8); ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = 'bold 9px Courier New, monospace';
  ctx.fillStyle = '#3f8a63';
  ctx.fillText('LEGENDA', lx+2, ly-18);
  ctx.restore();
  const entries = [
    { key:'data', label:'+1 DADO', sub:'+5% alarme' },
    { key:'encrypted', label:'+2 DADOS', sub:'+9% alarme' },
    { key:'cache', label:'-14%', sub:'reduz alarme' },
    { key:'firewall', label:'PERIGO', sub:'+18% alarme' }
  ];
  for(let i = 0; i < entries.length; i++){
    const e = entries[i];
    const style = CELL_STYLE[e.key];
    const ry = ly + i*rowH;
    const iconSize = Math.min(rowH*0.55, lw*0.42);
    const icx = lx + iconSize*0.75, icy = ry + rowH/2;
    ctx.save();
    ctx.translate(icx, icy);
    const hI = iconSize/2;
    rr(ctx, -hI, -hI, iconSize, iconSize, iconSize*0.22);
    ctx.fillStyle = `rgba(${style.bg[0]},${style.bg[1]},${style.bg[2]},0.96)`; ctx.fill();
    ctx.strokeStyle = style.stroke; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.shadowColor = style.stroke; ctx.shadowBlur = 8;
    style.icon(iconSize*0.65);
    ctx.restore();
    ctx.save();
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const tx = icx + iconSize*0.75;
    ctx.font = 'bold ' + Math.max(9, Math.round(rowH*0.24)) + 'px Courier New, monospace';
    ctx.fillStyle = style.stroke;
    ctx.fillText(e.label, tx, icy - rowH*0.13);
    ctx.font = Math.max(7, Math.round(rowH*0.17)) + 'px Courier New, monospace';
    ctx.fillStyle = '#5aa87a';
    ctx.fillText(e.sub, tx, icy + rowH*0.16);
    ctx.restore();
    if(i < entries.length - 1){
      ctx.save();
      ctx.strokeStyle = 'rgba(57,255,136,0.10)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(lx, ry + rowH); ctx.lineTo(lx + lw, ry + rowH);
      ctx.stroke(); ctx.restore();
    }
  }
}

function renderPhase3(){
  const p3 = phase3; if(!p3) return;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font = 'bold 10px Courier New, monospace';
  const inIntro = p3.roundIntroTimer > 0;
  const inPulse = p3.pulseActive > 0;
  if(inIntro){ ctx.fillStyle = '#8affc0'; ctx.fillText('MEMORIZE AS CORES DAS CÉLULAS', W/2, 76); }
  else if(inPulse){ ctx.fillStyle = '#ffd93b'; ctx.shadowColor = '#ffd93b'; ctx.shadowBlur = 10; ctx.fillText('⚡ PULSO — MEMORIZE! ⚡', W/2, 76); ctx.shadowBlur = 0; }
  else { ctx.fillStyle = '#5aa87a'; ctx.fillText('TOQUE PELO O QUE VOCÊ SE LEMBRA', W/2, 76); }
  ctx.restore();

  const barW = Math.min(W*0.82, 460);
  const barH = 12;
  const barX = (W - barW)/2;
  const barY = 96;
  const alarmPct = clamp(p3.alarm / p3.alarmMax, 0, 1);
  const pulse = p3.alarmPulse;
  ctx.save();
  rr(ctx, barX, barY, barW, barH, barH/2);
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,59,78,' + (0.4 + pulse*0.4) + ')';
  ctx.lineWidth = 1.5 + pulse*2;
  rr(ctx, barX, barY, barW, barH, barH/2); ctx.stroke();
  ctx.restore();
  if(alarmPct > 0.001){
    ctx.save();
    const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    grad.addColorStop(0, '#ffd93b'); grad.addColorStop(0.55, '#ff8a3b'); grad.addColorStop(1, '#ff2d55');
    ctx.fillStyle = grad; ctx.shadowColor = '#ff3b4e'; ctx.shadowBlur = 14;
    rr(ctx, barX+1, barY+1, (barW-2)*alarmPct, barH-2, (barH-2)/2); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 10px Courier New, monospace';
  ctx.fillStyle = '#ff5c7a';
  ctx.textAlign = 'left'; ctx.fillText('ALARME', barX, barY - 12);
  ctx.textAlign = 'right';
  ctx.fillStyle = alarmPct > 0.6 ? '#ff3b4e' : '#7dffb0';
  ctx.fillText(Math.floor(alarmPct*100) + '%', barX + barW, barY - 12);
  ctx.restore();

  const infoY = p3.gridY - 18;
  const gridRight = p3.gridX + p3.cols*p3.cellSize + (p3.cols-1)*p3.gap;
  ctx.save();
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 12px Courier New, monospace';
  if(p3.combo >= 2){
    ctx.textAlign = 'left';
    const comboCol = p3.combo >= 8 ? '#ff8a3b' : (p3.combo >= 4 ? '#ffd93b' : '#8affc0');
    ctx.fillStyle = comboCol; ctx.shadowColor = comboCol; ctx.shadowBlur = 10;
    ctx.fillText('COMBO x' + p3.combo, p3.gridX, infoY);
    ctx.shadowBlur = 0;
  } else {
    ctx.textAlign = 'left'; ctx.fillStyle = '#3f8a63';
    ctx.fillText('COMBO —', p3.gridX, infoY);
  }
  ctx.textAlign = 'right';
  const remain = Math.max(0, p3.pulseTimer);
  if(remain < 1.2){
    const blink = Math.floor(remain*8) % 2 === 0;
    ctx.fillStyle = blink ? '#ffd93b' : '#8affc0';
    ctx.shadowColor = '#ffd93b'; ctx.shadowBlur = 10;
    ctx.fillText('PULSO EM ' + remain.toFixed(1) + 's', gridRight, infoY);
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = '#3f8a63';
    ctx.fillText('PULSO ' + remain.toFixed(1) + 's', gridRight, infoY);
  }
  ctx.restore();

  const cs = p3.cellSize;
  const half = cs/2;
  const GRAY_BG = [18, 24, 22];
  const GRAY_STROKE = [90, 120, 105];

  for(let i = 0; i < p3.cells.length; i++){
    const c = p3.cells[i];
    const col = i % p3.cols;
    const row = Math.floor(i / p3.cols);
    const baseX = p3.gridX + col*(cs + p3.gap);
    const baseY = p3.gridY + row*(cs + p3.gap);
    const ccx = baseX + half, ccy = baseY + half;

    if(c.emptyTimer > 0){
      const t = 1 - c.emptyTimer / 0.65;
      const s = 0.55 + 0.2*Math.sin(t*Math.PI);
      ctx.save();
      ctx.translate(ccx, ccy); ctx.scale(s, s);
      ctx.globalAlpha = 0.35;
      rr(ctx, -half*0.85, -half*0.85, half*1.7, half*1.7, half*0.3);
      ctx.strokeStyle = 'rgba(120,160,140,0.55)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
      continue;
    }

    const style = CELL_STYLE[c.type] || CELL_STYLE.data;
    const rev = c.revealed;
    const bgRGB = lerpColor(GRAY_BG, style.bg, rev);
    const strokeRGB = lerpColor(GRAY_STROKE, style.strokeRGB, rev);

    let scale = 1, alpha = 1, rot = 0;
    if(c.spawnAnim < 1){
      const t = easeOut(c.spawnAnim);
      scale = 0.7 + 0.3*t; alpha = 0.4 + 0.6*t;
    }
    scale += Math.sin(c.breathe)*0.02;
    if(c.flash > 0) scale += c.flash*0.14;
    if(c.shake > 0) rot = Math.sin(performance.now()/28)*0.16*c.shake;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(ccx, ccy); ctx.rotate(rot); ctx.scale(scale, scale);

    const glowStrength = 0.35 + rev*0.65 + c.flash*0.6;
    ctx.shadowColor = rgbaStr(strokeRGB, 1);
    ctx.shadowBlur = 6 + rev*16 + c.flash*22;

    rr(ctx, -half*0.88, -half*0.88, half*1.76, half*1.76, half*0.24);
    ctx.fillStyle = rgbaStr(bgRGB, 0.96); ctx.fill();
    ctx.strokeStyle = rgbaStr(strokeRGB, 0.55 + glowStrength*0.4);
    ctx.lineWidth = 2.2; ctx.stroke();
    ctx.shadowBlur = 0;

    if(rev > 0.05){
      ctx.globalAlpha = alpha * rev;
      style.icon(half*0.92);
      ctx.globalAlpha = alpha;
    } else {
      ctx.globalAlpha = alpha * 0.35;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold ' + Math.floor(half*0.75) + 'px Courier New, monospace';
      ctx.fillStyle = rgbaStr(GRAY_STROKE, 1);
      ctx.fillText('?', 0, 0);
      ctx.globalAlpha = alpha;
    }
    ctx.restore();
  }

  renderLegend();

  if(p3.hintTimer > 0 && p3.roundIntroTimer <= 0){
    const a = Math.min(1, p3.hintTimer) * Math.min(1, (6.0 - p3.hintTimer)*2.5);
    ctx.save();
    ctx.globalAlpha = a * 0.85;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 14px Courier New, monospace';
    ctx.fillStyle = '#8affc0'; ctx.shadowColor = '#39ff88'; ctx.shadowBlur = 14;
    const yy = p3.gridY + (p3.rows*p3.cellSize + (p3.rows-1)*p3.gap) + 26;
    ctx.fillText('▼ MEMORIZE E TOQUE ▼', p3.gridX + (p3.cols*p3.cellSize + (p3.cols-1)*p3.gap)/2, yy);
    ctx.restore();
  }

  if(p3.roundIntroTimer > 0){
    const t = p3.roundIntroTimer;
    const fadeIn = clamp((3.0 - t)*1.6, 0, 1);
    const fadeOut = clamp(t*1.6, 0, 1);
    const alpha = Math.min(fadeIn, fadeOut);
    ctx.save();
    ctx.globalAlpha = alpha*0.55; ctx.fillStyle = 'rgba(2,7,5,0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#8affc0';
    ctx.font = 'bold clamp(26px, 5.5vw, 46px) Courier New, monospace';
    ctx.shadowColor = '#39ff88'; ctx.shadowBlur = 30;
    ctx.fillText('RODADA ' + p3.round + ' / ' + p3.maxRounds, W/2, H/2 - 44);
    ctx.font = 'bold 14px Courier New, monospace';
    ctx.fillStyle = '#7dffb0'; ctx.shadowBlur = 8;
    ctx.fillText('MEMORIZE — AS CÉLULAS FICARÃO CINZAS', W/2, H/2 - 4);
    ctx.fillStyle = '#5aa87a';
    ctx.font = 'bold 12px Courier New, monospace';
    ctx.shadowBlur = 0;
    ctx.fillText('ROUBE ' + p3.target + ' DADOS SEM DISPARAR O ALARME', W/2, H/2 + 22);
    ctx.restore();
  }
}

function render(){
  ctx.clearRect(0, 0, W, H);
  drawBackground();

  ctx.save();
  if(screenShake > 0){
    const mag = screenShake * 8;
    ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
  }

  if(state === 'playing' || state === 'transition' || state === 'paused'){
    if(phase3) renderPhase3();
    else if(phase2) renderPhase2();
    else if(cable || target || obstacles.length) renderPhase1();
  } else if(state === 'phase2'){ renderPhase2(); }
  else if(state === 'phase3'){ renderPhase3(); }

  drawParticles();
  drawPopups();
  ctx.restore();
}

/* =========================================================
   LOOP
   ========================================================= */
function loop(t){
  if(!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if(dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* =========================================================
   CONTROLES
   ========================================================= */
function getPos(e){
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  if(state === 'paused') return;
  if(state === 'phase3'){ const p = getPos(e); phase3Tap(p.x, p.y); e.preventDefault(); return; }
  if(state === 'phase2'){ const p = getPos(e); updatePhase2Player(p.y); e.preventDefault(); return; }
  if(state !== 'playing') return;

  if(!cable || cable.connected) return;
  const p = getPos(e);
  const d = Math.hypot(p.x - cable.tip.x, p.y - cable.tip.y);
  const grabR = 46;
  if(d < grabR){
    cable.dragging = true;
    cable.grabOffX = p.x - cable.tip.x;
    cable.grabOffY = p.y - cable.tip.y;
    cable.targetX = cable.tip.x;
    cable.targetY = cable.tip.y;
    Sfx.grab();
    burst(cable.tip.x, cable.tip.y, '#39ff88', 8);
    try { canvas.setPointerCapture(e.pointerId); } catch(err){}
    e.preventDefault();
  }
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  if(state === 'paused') return;
  if(state === 'phase2'){ const p = getPos(e); updatePhase2Player(p.y); e.preventDefault(); return; }
  if(state !== 'playing' || !cable || !cable.dragging) return;
  const p = getPos(e);
  cable.targetX = p.x - cable.grabOffX;
  cable.targetY = p.y - cable.grabOffY;
  e.preventDefault();
}, { passive: false });

function releasePointer(e){
  if(state === 'paused') return;
  if(state !== 'playing' || !cable || !cable.dragging) return;
  cable.dragging = false;
  Sfx.drop();
  try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
}

canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('beforeunload', (e) => {
  if(state !== 'menu' && state !== 'win'){ e.preventDefault(); e.returnValue = ''; }
});

/* =========================================================
   INIT
   ========================================================= */
resize();
requestAnimationFrame(loop);
console.log('[HACK://PROTOCOLO v4.5] Iniciado. Storage:', storageAvailable);
</script>
